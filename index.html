<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f0e8">
<title>おさんぽログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Kaisei+Opti:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --sage: #7a9470;
    --sage-light: #b0c4a6;
    --sage-pale: #e8f0e4;
    --cream: #f5f0e8;
    --warm-white: #faf8f3;
    --terracotta: #bf6e52;
    --terracotta-light: #e8a98a;
    --terracotta-pale: #faeae4;
    --charcoal: #383230;
    --mid: #7a706a;
    --sand: #d8cdb8;
    --sand-light: #ede7da;
    --blush: #f0e0d8;
    --mint-green: #c8dfc4;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    height: -webkit-fill-available;
    overflow: hidden;
    font-family: 'Zen Maru Gothic', sans-serif;
    background: var(--warm-white);
    color: var(--charcoal);
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
  }

  /* ─── Header ─── */
  .header {
    padding: calc(var(--safe-top) + 10px) 16px 10px;
    background: var(--cream);
    border-bottom: 1.5px solid var(--sand);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 50;
  }

  .logo {
    font-family: 'Kaisei Opti', serif;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: var(--charcoal);
  }

  .logo em { color: var(--sage); font-style: normal; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sync-btn {
    background: none;
    border: 1.5px solid var(--sand);
    border-radius: 20px;
    padding: 5px 12px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 11px;
    color: var(--mid);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }

  .sync-btn:active { background: var(--sand-light); }
  .sync-btn.syncing { color: var(--sage); border-color: var(--sage-light); }

  /* ─── Views ─── */
  .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }

  /* ─── Bottom Nav ─── */
  .bottom-nav {
    display: flex;
    background: var(--cream);
    border-top: 1.5px solid var(--sand);
    padding-bottom: var(--safe-bottom);
    flex-shrink: 0;
    z-index: 50;
  }

  .nav-btn {
    flex: 1;
    padding: 10px 4px 8px;
    border: none;
    background: none;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 10px;
    color: var(--mid);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: color 0.15s;
  }

  .nav-btn .nav-icon { font-size: 22px; line-height: 1; }
  .nav-btn.active { color: var(--sage); }
  .nav-btn.active .nav-icon { transform: scale(1.1); }

  /* ─── MAP VIEW ─── */
  #map {
    flex: 1;
    z-index: 1;
  }

  .map-panel {
    background: var(--cream);
    border-top: 1.5px solid var(--sand);
    padding: 12px 16px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .walk-info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .recording-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--sand-light);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--mid);
    transition: all 0.3s;
  }

  .recording-pill.active {
    background: var(--terracotta-pale);
    color: var(--terracotta);
  }

  .rec-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--sand);
    flex-shrink: 0;
  }

  .rec-dot.on {
    background: var(--terracotta);
    animation: blink 1.1s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .mini-stats {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--mid);
  }

  .mini-stat { display: flex; align-items: center; gap: 3px; }

  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .btn {
    padding: 13px 8px;
    border: none;
    border-radius: 16px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    line-height: 1;
  }

  .btn .btn-icon { font-size: 20px; }
  .btn:active { transform: scale(0.95); opacity: 0.85; }
  .btn:disabled { opacity: 0.35; pointer-events: none; }

  .btn-start { background: var(--sage); color: white; }
  .btn-stop  { background: var(--terracotta); color: white; }
  .btn-pin   { background: var(--blush); color: var(--charcoal); border: 1.5px solid var(--terracotta-light); }

  /* ─── LOG LIST VIEW ─── */
  .log-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 16px 24px;
  }

  .log-month-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--sage);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 16px 0 8px;
  }

  .log-month-label:first-child { margin-top: 0; }

  .log-card {
    background: white;
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 1.5px solid var(--sand-light);
    cursor: pointer;
    transition: all 0.15s;
    active-scale: 0.98;
  }

  .log-card:active { transform: scale(0.99); border-color: var(--sage-light); }

  .log-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .log-date-main {
    font-family: 'Kaisei Opti', serif;
    font-size: 16px;
    color: var(--charcoal);
  }

  .log-date-day {
    font-size: 11px;
    color: var(--mid);
    margin-top: 1px;
  }

  .log-dur {
    background: var(--sage-pale);
    color: var(--sage);
    border-radius: 10px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .log-meta-row {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--mid);
    margin-bottom: 8px;
  }

  .spot-chips {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .spot-chip {
    background: var(--cream);
    border: 1px solid var(--sand);
    border-radius: 10px;
    padding: 2px 9px;
    font-size: 11px;
    color: var(--mid);
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 40px 24px;
    text-align: center;
    color: var(--mid);
  }

  .empty-icon { font-size: 52px; }
  .empty-text { font-size: 14px; line-height: 1.7; }

  /* ─── DETAIL VIEW ─── */
  .detail-back {
    padding: 10px 16px;
    border: none;
    background: var(--cream);
    border-bottom: 1.5px solid var(--sand);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    color: var(--mid);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    text-align: left;
  }

  .detail-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  #detail-map { height: 240px; }

  .detail-body { padding: 16px; }

  .detail-head {
    margin-bottom: 16px;
  }

  .detail-title {
    font-family: 'Kaisei Opti', serif;
    font-size: 20px;
    margin-bottom: 6px;
  }

  .detail-meta {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--mid);
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--sage);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .spot-card {
    background: var(--cream);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 1px solid var(--sand);
  }

  .spot-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .spot-card-name {
    font-weight: 700;
    font-size: 15px;
  }

  .repeat-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .rp-yes   { background: #d6edda; color: #2e7a42; }
  .rp-no    { background: #fde4e4; color: #9e3535; }
  .rp-maybe { background: #fef3d8; color: #8a6a20; }

  .spot-card-comment {
    font-size: 13px;
    color: var(--mid);
    line-height: 1.6;
    margin-bottom: 6px;
  }

  .spot-card-photo {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 6px;
  }

  /* ─── MODAL ─── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(40,35,30,0.45);
    z-index: 200;
    align-items: flex-end;
    backdrop-filter: blur(2px);
  }

  .overlay.open { display: flex; }

  .sheet {
    background: var(--warm-white);
    border-radius: 24px 24px 0 0;
    padding: 16px 20px calc(var(--safe-bottom) + 20px);
    width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    animation: slideUp 0.25s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(60px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--sand);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .sheet-title {
    font-family: 'Kaisei Opti', serif;
    font-size: 18px;
    text-align: center;
    margin-bottom: 18px;
  }

  .form-block { margin-bottom: 14px; }

  .form-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--mid);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    display: block;
  }

  .form-input, .form-textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--sand);
    border-radius: 14px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    background: white;
    color: var(--charcoal);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .form-input:focus, .form-textarea:focus { border-color: var(--sage); }
  .form-textarea { resize: none; min-height: 90px; }

  .repeat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }

  .repeat-opt {
    padding: 11px 6px;
    border: 1.5px solid var(--sand);
    border-radius: 14px;
    background: white;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    color: var(--mid);
    transition: all 0.15s;
    line-height: 1.4;
  }

  .repeat-opt:active { transform: scale(0.96); }
  .repeat-opt.sel-yes   { background: #d6edda; border-color: #7ac48a; color: #2e7a42; font-weight: 700; }
  .repeat-opt.sel-no    { background: #fde4e4; border-color: #e08080; color: #9e3535; font-weight: 700; }
  .repeat-opt.sel-maybe { background: #fef3d8; border-color: #e0c060; color: #8a6a20; font-weight: 700; }

  .photo-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px;
    border: 1.5px dashed var(--sand);
    border-radius: 14px;
    background: var(--cream);
    color: var(--mid);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .photo-label:active { background: var(--sand-light); }

  .photo-preview-wrap { position: relative; }

  .photo-prev {
    width: 100%;
    max-height: 160px;
    object-fit: cover;
    border-radius: 12px;
    display: none;
    margin-top: 8px;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 4px;
  }

  .btn-sheet-ok {
    padding: 14px;
    background: var(--sage);
    color: white;
    border: none;
    border-radius: 16px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-sheet-ok:active { transform: scale(0.97); }

  .btn-sheet-cancel {
    padding: 14px;
    background: white;
    color: var(--mid);
    border: 1.5px solid var(--sand);
    border-radius: 16px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-sheet-cancel:active { background: var(--sand-light); }

  /* ─── Save modal ─── */
  .save-sheet-content { display: flex; flex-direction: column; gap: 14px; }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 80px);
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--charcoal);
    color: white;
    padding: 11px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.25s;
    z-index: 500;
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── Loading overlay ─── */
  .loading-cover {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(245,240,232,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    font-size: 14px;
    color: var(--mid);
  }

  .loading-cover.show { display: flex; }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--sand);
    border-top-color: var(--sage);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Leaflet popup tweak */
  .leaflet-popup-content-wrapper {
    border-radius: 12px !important;
    font-family: 'Zen Maru Gothic', sans-serif !important;
    font-size: 13px !important;
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="logo">おさんぽ<em>ログ</em></div>
    <div class="header-right">
      <button class="sync-btn" id="sync-btn" onclick="syncAll()">
        <span id="sync-icon">☁️</span> <span id="sync-label">同期</span>
      </button>
    </div>
  </div>

  <!-- MAP VIEW -->
  <div class="view active" id="view-map">
    <div id="map"></div>
    <div class="map-panel">
      <div class="walk-info-row">
        <div class="recording-pill" id="rec-pill">
          <div class="rec-dot" id="rec-dot"></div>
          <span id="rec-label">記録待ち</span>
        </div>
        <div class="mini-stats">
          <div class="mini-stat">⏱ <span id="stat-time">0:00</span></div>
          <div class="mini-stat">📍 <span id="stat-spots">0</span>店</div>
        </div>
      </div>
      <div class="action-row">
        <button class="btn btn-start" id="btn-start" onclick="startWalk()">
          <span class="btn-icon">🐾</span>スタート
        </button>
        <button class="btn btn-stop" id="btn-stop" onclick="confirmStop()" disabled>
          <span class="btn-icon">✅</span>おわり
        </button>
        <button class="btn btn-pin" id="btn-pin" onclick="openPinModal()" disabled>
          <span class="btn-icon">📍</span>ピン
        </button>
      </div>
    </div>
  </div>

  <!-- LOGS VIEW -->
  <div class="view" id="view-logs">
    <div class="log-scroll" id="log-scroll">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🌿</div>
        <div class="empty-text">まだきろくがありません<br>さんぽをはじめましょう！</div>
      </div>
    </div>
  </div>

  <!-- DETAIL VIEW -->
  <div class="view" id="view-detail">
    <button class="detail-back" onclick="backToLogs()">← きろく一覧</button>
    <div class="detail-scroll">
      <div id="detail-map"></div>
      <div class="detail-body">
        <div class="detail-head">
          <div class="detail-title" id="detail-title"></div>
          <div class="detail-meta" id="detail-meta"></div>
        </div>
        <div id="detail-spots"></div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-map" onclick="showView('map')">
      <span class="nav-icon">🗺️</span>さんぽ
    </button>
    <button class="nav-btn" id="nav-logs" onclick="showView('logs')">
      <span class="nav-icon">📋</span>きろく
    </button>
  </div>

</div><!-- /app -->

<!-- PIN MODAL -->
<div class="overlay" id="pin-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">📍 スポットを記録</div>

    <div class="form-block">
      <label class="form-label">お店・場所の名前</label>
      <input class="form-input" id="pin-name" placeholder="例）〇〇カフェ" autocomplete="off"/>
    </div>

    <div class="form-block">
      <label class="form-label">感想・メモ</label>
      <textarea class="form-textarea" id="pin-comment" placeholder="コーヒーがおいしかった、など"></textarea>
    </div>

    <div class="form-block">
      <label class="form-label">また行く？</label>
      <div class="repeat-grid">
        <div class="repeat-opt" id="ropt-yes" onclick="selRepeat('yes')">💚<br>リピあり</div>
        <div class="repeat-opt sel-maybe" id="ropt-maybe" onclick="selRepeat('maybe')">🤔<br>またいつか</div>
        <div class="repeat-opt" id="ropt-no" onclick="selRepeat('no')">🙅<br>リピなし</div>
      </div>
    </div>

    <div class="form-block">
      <label class="form-label">写真（任意）</label>
      <label class="photo-label">
        📷 写真を選ぶ
        <input type="file" accept="image/*" capture="environment" id="pin-photo-input" style="display:none" onchange="handlePhoto(event)"/>
      </label>
      <div class="photo-preview-wrap">
        <img class="photo-prev" id="pin-photo-prev"/>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-sheet-cancel" onclick="closePinModal()">キャンセル</button>
      <button class="btn-sheet-ok" onclick="savePin()">保存する</button>
    </div>
  </div>
</div>

<!-- STOP CONFIRM MODAL -->
<div class="overlay" id="stop-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">さんぽをおわりますか？</div>
    <div class="save-sheet-content">
      <div style="text-align:center;font-size:13px;color:var(--mid);line-height:1.7">
        記録したルートとスポットを保存します。<br>クラウドにも同期します。
      </div>
      <div class="btn-row">
        <button class="btn-sheet-cancel" onclick="closeStopModal()">もどる</button>
        <button class="btn-sheet-ok" onclick="stopWalk()">保存する</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Loading -->
<div class="loading-cover" id="loading">
  <div class="spinner"></div>
  <div id="loading-text">同期中...</div>
</div>

<script>
// ============================================================
//  CONFIG — GASのURLをデプロイ後に書き換える
// ============================================================
const GAS_URL = 'YOUR_GAS_URL_HERE';

// ============================================================
//  State
// ============================================================
let map, detailMap;
let walkActive = false;
let watchId = null;
let routeCoords = [];
let currentSpots = [];
let currentStartTime = null;
let timerInterval = null;
let walks = [];          // ローカルメモリ（表示用）
let selectedRepeat = 'maybe';
let pinPhotoData = null;
let currentPos = null;
let currentMarker = null;

// ============================================================
//  Map Init
// ============================================================
function initMap() {
  map = L.map('map', {
    zoomControl: false,
    attributionControl: false,
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
  }).addTo(map);

  map.setView([35.6762, 139.6503], 15);

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      currentPos = [pos.coords.latitude, pos.coords.longitude];
      map.setView(currentPos, 16);
      updateCurrentMarker(currentPos);
    }, () => {});
  }
}

function updateCurrentMarker(latlng) {
  if (currentMarker) map.removeLayer(currentMarker);
  currentMarker = L.circleMarker(latlng, {
    radius: 8,
    fillColor: '#7a9470',
    color: 'white',
    weight: 2.5,
    fillOpacity: 1,
  }).addTo(map);
}

// ============================================================
//  Walk
// ============================================================
function startWalk() {
  if (!navigator.geolocation) {
    showToast('位置情報が利用できません');
    return;
  }

  walkActive = true;
  routeCoords = [];
  currentSpots = [];
  currentStartTime = Date.now();

  // clear map overlays
  map.eachLayer(l => {
    if (l instanceof L.Polyline || l instanceof L.Marker) map.removeLayer(l);
  });
  currentMarker = null;

  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('btn-pin').disabled = false;
  document.getElementById('rec-dot').classList.add('on');
  document.getElementById('rec-pill').classList.add('active');
  document.getElementById('rec-label').textContent = '記録中…';
  document.getElementById('stat-spots').textContent = '0';
  document.getElementById('stat-time').textContent = '0:00';

  timerInterval = setInterval(tickTimer, 1000);

  let routeLine = null;

  watchId = navigator.geolocation.watchPosition(pos => {
    const latlng = [pos.coords.latitude, pos.coords.longitude];
    currentPos = latlng;
    routeCoords.push(latlng);

    if (!routeLine) {
      routeLine = L.polyline([latlng], {
        color: '#7a9470',
        weight: 5,
        opacity: 0.85,
        lineJoin: 'round',
        lineCap: 'round',
      }).addTo(map);
    } else {
      routeLine.addLatLng(latlng);
    }

    updateCurrentMarker(latlng);
    map.panTo(latlng, { animate: true, duration: 0.5 });

  }, err => {
    showToast('GPS取得エラー: ' + err.message);
  }, {
    enableHighAccuracy: true,
    maximumAge: 3000,
    timeout: 15000,
  });
}

function confirmStop() {
  document.getElementById('stop-overlay').classList.add('open');
}

function closeStopModal() {
  document.getElementById('stop-overlay').classList.remove('open');
}

async function stopWalk() {
  closeStopModal();
  if (!walkActive) return;

  walkActive = false;
  navigator.geolocation.clearWatch(watchId);
  clearInterval(timerInterval);

  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-pin').disabled = true;
  document.getElementById('rec-dot').classList.remove('on');
  document.getElementById('rec-pill').classList.remove('active');
  document.getElementById('rec-label').textContent = '記録完了';

  if (routeCoords.length === 0) {
    showToast('ルートデータがありません');
    document.getElementById('rec-label').textContent = '記録待ち';
    return;
  }

  const duration = Math.floor((Date.now() - currentStartTime) / 1000);
  const walk = {
    id: Date.now(),
    date: new Date(),
    duration,
    coords: [...routeCoords],
    spots: [...currentSpots],
  };
  walks.unshift(walk);

  // クラウドへ保存
  await saveWalkToSheet(walk);
  showToast('さんぽを保存しました 🐾');
}

function tickTimer() {
  const elapsed = Math.floor((Date.now() - currentStartTime) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  document.getElementById('stat-time').textContent = `${m}:${String(s).padStart(2,'0')}`;
}

// ============================================================
//  Pin Modal
// ============================================================
function openPinModal() {
  document.getElementById('pin-name').value = '';
  document.getElementById('pin-comment').value = '';
  document.getElementById('pin-photo-prev').style.display = 'none';
  document.getElementById('pin-photo-input').value = '';
  pinPhotoData = null;
  selRepeat('maybe');
  document.getElementById('pin-overlay').classList.add('open');
  setTimeout(() => document.getElementById('pin-name').focus(), 300);
}

function closePinModal() {
  document.getElementById('pin-overlay').classList.remove('open');
}

function selRepeat(val) {
  selectedRepeat = val;
  document.getElementById('ropt-yes').className   = 'repeat-opt' + (val === 'yes'   ? ' sel-yes'   : '');
  document.getElementById('ropt-no').className    = 'repeat-opt' + (val === 'no'    ? ' sel-no'    : '');
  document.getElementById('ropt-maybe').className = 'repeat-opt' + (val === 'maybe' ? ' sel-maybe' : '');
}

function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;

  // Resize for performance
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pinPhotoData = canvas.toDataURL('image/jpeg', 0.75);
      const prev = document.getElementById('pin-photo-prev');
      prev.src = pinPhotoData;
      prev.style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function savePin() {
  const name = document.getElementById('pin-name').value.trim() || '名前なし';
  const comment = document.getElementById('pin-comment').value.trim();
  const pos = currentPos || (routeCoords.length > 0 ? routeCoords[routeCoords.length - 1] : null);

  if (!pos) { showToast('位置が取得できていません'); return; }

  const spot = {
    id: Date.now(),
    name, comment,
    repeat: selectedRepeat,
    photo: pinPhotoData,
    latlng: pos,
  };

  currentSpots.push(spot);
  document.getElementById('stat-spots').textContent = currentSpots.length;

  // マーカー追加
  const color = selectedRepeat === 'no' ? '#bf6e52' : '#7a9470';
  const icon = L.divIcon({
    html: `<div style="background:${color};color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;border:2.5px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.25)">🏪</div>`,
    className: '',
    iconSize: [30, 30],
    iconAnchor: [15, 15],
  });

  L.marker(pos, { icon })
    .addTo(map)
    .bindPopup(`<b>${name}</b>${comment ? '<br>' + comment : ''}`);

  closePinModal();
  showToast(`${name} を記録しました 📍`);
}

// ============================================================
//  Google Sheets 連携
// ============================================================
async function saveWalkToSheet(walk) {
  if (GAS_URL === 'YOUR_GAS_URL_HERE') return; // 未設定時はスキップ
  try {
    showLoading('クラウドに保存中...');
    const payload = {
      action: 'saveWalk',
      id: walk.id,
      date: walk.date.toISOString(),
      duration: walk.duration,
      coords: JSON.stringify(walk.coords),
      spots: JSON.stringify(walk.spots.map(s => ({
        id: s.id,
        name: s.name,
        comment: s.comment,
        repeat: s.repeat,
        latlng: s.latlng,
        photo: s.photo || '',
      }))),
    };
    await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
    });
  } catch (e) {
    showToast('クラウド保存に失敗しました');
  } finally {
    hideLoading();
  }
}

async function syncAll() {
  if (GAS_URL === 'YOUR_GAS_URL_HERE') {
    showToast('GAS URLが未設定です');
    return;
  }
  try {
    const btn = document.getElementById('sync-btn');
    btn.classList.add('syncing');
    document.getElementById('sync-label').textContent = '同期中';
    showLoading('データを取得中...');

    const res = await fetch(GAS_URL + '?action=getWalks');
    const data = await res.json();

    if (data.walks) {
      walks = data.walks.map(w => ({
        ...w,
        date: new Date(w.date),
        coords: typeof w.coords === 'string' ? JSON.parse(w.coords) : w.coords,
        spots: typeof w.spots === 'string' ? JSON.parse(w.spots) : w.spots,
      }));
      renderLogList();
      showToast(`${walks.length}件のきろくを取得しました`);
    }
  } catch (e) {
    showToast('同期に失敗しました');
  } finally {
    hideLoading();
    const btn = document.getElementById('sync-btn');
    btn.classList.remove('syncing');
    document.getElementById('sync-label').textContent = '同期';
  }
}

// ============================================================
//  Log List
// ============================================================
function renderLogList() {
  const el = document.getElementById('log-scroll');

  if (walks.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🌿</div>
        <div class="empty-text">まだきろくがありません<br>さんぽをはじめましょう！</div>
      </div>`;
    return;
  }

  // 月ごとにグループ
  const groups = {};
  walks.forEach(w => {
    const key = `${w.date.getFullYear()}年${w.date.getMonth()+1}月`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(w);
  });

  let html = '';
  for (const [month, ws] of Object.entries(groups)) {
    html += `<div class="log-month-label">${month}</div>`;
    ws.forEach(w => {
      const chips = w.spots.map(s => `<div class="spot-chip">${s.name}</div>`).join('');
      html += `
        <div class="log-card" onclick="showDetail(${w.id})">
          <div class="log-card-top">
            <div>
              <div class="log-date-main">${fmtDate(w.date)}</div>
              <div class="log-date-day">${['日','月','火','水','木','金','土'][w.date.getDay()]}曜日</div>
            </div>
            <div class="log-dur">${fmtDur(w.duration)}</div>
          </div>
          <div class="log-meta-row">
            <span>🏪 ${w.spots.length}スポット</span>
            <span>📍 ${w.coords.length}記録点</span>
          </div>
          ${chips ? `<div class="spot-chips">${chips}</div>` : ''}
        </div>`;
    });
  }

  el.innerHTML = html;
}

// ============================================================
//  Detail
// ============================================================
function showDetail(id) {
  const w = walks.find(x => x.id === id);
  if (!w) return;
  showView('detail');

  document.getElementById('detail-title').textContent = fmtDate(w.date) + ' のおさんぽ';
  document.getElementById('detail-meta').innerHTML =
    `<span>⏱ ${fmtDur(w.duration)}</span><span>🏪 ${w.spots.length}スポット</span><span>📍 ${w.coords.length}点</span>`;

  // Detail map
  const dmEl = document.getElementById('detail-map');
  dmEl.innerHTML = '';
  if (detailMap) { detailMap.remove(); detailMap = null; }

  detailMap = L.map(dmEl, { zoomControl: false, attributionControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(detailMap);

  if (w.coords.length > 0) {
    const line = L.polyline(w.coords, { color: '#7a9470', weight: 5, opacity: 0.85 }).addTo(detailMap);
    detailMap.fitBounds(line.getBounds(), { padding: [24, 24] });
  } else {
    detailMap.setView([35.6762, 139.6503], 14);
  }

  w.spots.forEach(s => {
    const icon = L.divIcon({
      html: `<div style="background:#7a9470;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.25)">🏪</div>`,
      className: '', iconSize: [26, 26], iconAnchor: [13, 13],
    });
    L.marker(s.latlng, { icon }).addTo(detailMap).bindPopup(`<b>${s.name}</b>`);
  });

  // Spots list
  const spotsEl = document.getElementById('detail-spots');
  if (w.spots.length === 0) {
    spotsEl.innerHTML = '<div style="font-size:13px;color:var(--mid)">スポットの記録なし</div>';
    return;
  }

  const repeatLabel = r =>
    r === 'yes'   ? '<span class="repeat-pill rp-yes">💚 リピあり</span>' :
    r === 'no'    ? '<span class="repeat-pill rp-no">🙅 リピなし</span>' :
                    '<span class="repeat-pill rp-maybe">🤔 またいつか</span>';

  spotsEl.innerHTML = `<div class="section-label">スポット</div>` +
    w.spots.map(s => `
      <div class="spot-card">
        <div class="spot-card-top">
          <div class="spot-card-name">${s.name}</div>
          ${repeatLabel(s.repeat)}
        </div>
        ${s.comment ? `<div class="spot-card-comment">${s.comment}</div>` : ''}
        ${s.photo ? `<img src="${s.photo}" class="spot-card-photo"/>` : ''}
      </div>`).join('');
}

function backToLogs() {
  showView('logs');
}

// ============================================================
//  View Switcher
// ============================================================
function showView(name) {
  ['map', 'logs', 'detail'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('active', v === name);
  });

  ['map', 'logs'].forEach(t => {
    const el = document.getElementById('nav-' + t);
    if (el) el.classList.toggle('active', t === name);
  });

  if (name === 'logs') renderLogList();
  if (name === 'map')    setTimeout(() => map?.invalidateSize(), 80);
  if (name === 'detail') setTimeout(() => detailMap?.invalidateSize(), 80);
}

// ============================================================
//  Helpers
// ============================================================
function fmtDate(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function fmtDur(sec) {
  const m = Math.floor(sec / 60);
  if (m === 0) return `${sec}秒`;
  if (m < 60) return `${m}分`;
  return `${Math.floor(m/60)}時間${m%60}分`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function showLoading(msg = '処理中...') {
  document.getElementById('loading-text').textContent = msg;
  document.getElementById('loading').classList.add('show');
}

function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}

// ============================================================
//  Boot
// ============================================================
initMap();
</script>

</html>
